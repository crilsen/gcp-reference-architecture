apiVersion: v1
kind: Namespace
metadata:
  name: lab-workloads
  labels:
    app.kubernetes.io/part-of: multi-cloud-kubernetes-lab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-world-content
  namespace: lab-workloads
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;

      location / {
        root /usr/share/nginx/html;
        index index.html;
      }

      location = /healthz {
        access_log off;
        return 200 "ok\n";
      }
    }
  index.html: |
    <!doctype html>
    <html lang="pt-BR">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Hello World no GKE</title>
      </head>
      <body>
        <h1>Hello World!</h1>
        <p>Aplicação executando no GKE Standard.</p>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
  namespace: lab-workloads
  labels:
    app.kubernetes.io/name: hello-world
    app.kubernetes.io/part-of: multi-cloud-kubernetes-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-world
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello-world
        app.kubernetes.io/part-of: multi-cloud-kubernetes-lab
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
            - name: content
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: content
          configMap:
            name: hello-world-content
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: hello-world
  namespace: lab-workloads
  labels:
    app.kubernetes.io/name: hello-world
  annotations:
    # Expose port 80 as a standalone NEG named kubernetes-lab-hello-world.
    # The name must match var.neg_name in environments/lab (custom NEG names
    # must be unique within the region).
    cloud.google.com/neg: '{"exposed_ports": {"80": {"name": "kubernetes-lab-hello-world"}}}'
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hello-world
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
# The global external Application Load Balancer, its health check, the Cloud
# Armor policy, and the Certificate Manager certificate are provisioned by
# Terraform in environments/lab, not by a Kubernetes Ingress.
